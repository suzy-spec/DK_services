  .card { background: #FAFAFA; border-radius: 8px; padding: 1rem; }
  .card2 { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 14px; }
  .stat-label { font-size: 13px; color: #6B7280; }

  .th-row td { color: #6B7280; border-bottom: 1px solid #E5E7EB; }

<script>
const titles = {funnel1:'골든패스', funnel2:'목적지 경로', content1:'기간별 콘텐츠 조회수', content2:'인기 콘텐츠 TOP 20', traffic1:'기간별 방문자수', traffic2:'유입 키워드'};
const charts = {};
function ensureChart(id, cfg){ if(charts[id]) return; const ctx=document.getElementById(id); if(!ctx) return; charts[id]=new Chart(ctx, cfg); }

const gpSteps = [
  {label:'전입', count:'12,480', rate:'100.0%', wow:'▲12.3% vs 직전'},
  {label:'서비스 소개 조회', count:'4,120', rate:'33.0% 전입 대비', wow:'▲8.1% vs 직전'},
  {label:'문의/신청 폼 진입', count:'612', rate:'4.9% 전입 대비', wow:'▲15.6% vs 직전'},
  {label:'이메일문의 완료', count:'184', rate:'1.5% 전입 대비', wow:'▲6.2% vs 직전'},
  {label:'소개서 신청 완료', count:'96', rate:'0.8% 전입 대비', wow:'▲9.4% vs 직전'}
];
document.getElementById('gp-steps').innerHTML = gpSteps.map(s=>`
  <div style="flex:1 1 0; min-width:110px; padding:6px 10px;">
    <div style="font-size:11px; color:#6B7280; font-weight:600;">${s.label}</div>
    <div style="font-size:18px; font-weight:600; margin:2px 0;">${s.count}</div>
    <div style="font-size:10.5px; color:#9CA3AF;">${s.rate}</div>
    <div style="font-size:10.5px; color:#16a34a; font-weight:600;">${s.wow}</div>
  </div>`).join('');

const destData = {
  email: {
    stats: [['이메일문의 페이지 진입 세션수','4,120','▲8.1%'],['이메일문의 페이지 진입 사용자수','3,340','▲6.4%'],['문의 폼 진입 세션수','612','▼4.9%'],['문의 폼 진입율','14.9%','▼1.2%p'],['문의 폼 작성 완료 사용자수','201','▲9.0%'],['이메일문의 완료건수','184','▲6.2%'],['문의 제출율','30.1%','▲2.1%p'],['이메일문의 완료 사용자수','170','▲5.8%']],
    funnel: [['이메일문의 페이지 진입',4120],['문의 폼 진입',612],['이메일문의 완료',184]],
    exit: [['이탈 · 세션 종료',1980,44.2],['홈페이지',820,18.3],['서비스 소개 다른 페이지',610,13.6],['소개서 신청 페이지',420,9.4],['블로그',310,6.9],['가격 안내',180,4.0]]
  },
  brochure: {
    stats: [['소개서 신청 페이지 진입 세션수','2,860','▲5.0%'],['소개서 신청 페이지 진입 사용자수','2,210','▲4.1%'],['신청 폼 진입 세션수','340','▼3.2%'],['신청 폼 진입율','11.9%','▼0.8%p'],['신청 폼 작성 완료 사용자수','110','▲7.5%'],['소개서 신청 완료건수','96','▲9.4%'],['신청 제출율','28.2%','▲1.6%p'],['소개서 신청 완료 사용자수','88','▲8.0%']],

    exit: [['이탈 · 세션 종료',1420,49.7],['홈페이지',540,18.9],['이메일문의 페이지',380,13.3],['서비스 소개 다른 페이지',290,10.1],['블로그',230,8.0]]
  }
};

function renderDest(key){
  const d = destData[key];
  document.getElementById('dest-stats').innerHTML = d.stats.map(([l,v,w])=>`
    <div class="card">
      <div style="font-size:11px; color:#6B7280;">${l}</div>
      <div style="font-size:18px; font-weight:600;">${v}</div>
      <div style="font-size:10.5px; color:${w[0]==='▲'?'#16a34a':'#dc2626'};">${w}</div>
    </div>`).join('');
  const maxV = d.funnel[0][1];
  document.getElementById('funnel-bars').innerHTML = d.funnel.map(([l,v])=>`
    <div style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;"><span>${l}</span><span style="color:#6B7280;">${v.toLocaleString()}</span></div>
      <div style="background:#F0F0F0; border-radius:4px; height:10px;"><div style="background:#F97316; width:${Math.round(v/maxV*100)}%; height:10px; border-radius:4px;"></div></div>
    </div>`).join('');
  document.getElementById('exit-bars').innerHTML = d.exit.map(([l,v,p],i)=>`
    <div style="margin-bottom:8px;">
      <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;"><span>${l}</span><span style="color:#6B7280;">${v.toLocaleString()} (${p}%)</span></div>
      <div style="background:#F0F0F0; border-radius:4px; height:8px;"><div style="background:${i===0?'#dc2626':'#378ADD'}; width:${p}%; height:8px; border-radius:4px;"></div></div>
    </div>`).join('');
}
document.getElementById('dest-select').addEventListener('change', e=>renderDest(e.target.value));

const days = Array.from({length:14}, (_,i)=>`07-${String(i+15).padStart(2,'0')}`);

const newV = [1050,1120,980,1200,1300,1150,1080,1250,1180,1400,1320,1100,1250,1300];
const retV = [520,480,600,450,550,600,480,520,600,470,550,620,500,560];

function drawCharts(){

    {label:'신규', data:newV, backgroundColor:'#F97316'},
    {label:'재방문', data:retV, backgroundColor:'#FED7AA'}
